# Render terminates TLS and forwards to Apache on an internal $PORT.
# Without these settings, Apache issues redirects like:
#   http://norix-security.onrender.com:10000/admin
# which breaks Filament login/dashboard behind Cloudflare.

UseCanonicalName Off
UseCanonicalPhysicalPort Off
DirectorySlash Off

# Honour the public HTTPS scheme from Render's proxy.
SetEnvIf X-Forwarded-Proto "https" HTTPS=on
SetEnvIf X-Forwarded-Proto "https" SERVER_PORT=443

<IfModule mod_headers.c>
    RequestHeader set X-Forwarded-Proto "https" env=HTTPS
</IfModule>
